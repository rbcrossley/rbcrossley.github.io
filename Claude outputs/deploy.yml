name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The site is served on its own domain, so SITE must be that domain and
      # not the github.io URL. SITE feeds every canonical URL, og:url, JSON-LD
      # url and sitemap <loc> — pointing it at github.io tells Google the
      # content lives there instead of here. BASE is "/" because the custom
      # domain serves from the root, not from /<repo>/.
      - name: Build with Astro
        env:
          SITE: https://berojgarengineer.com
          BASE: /
        run: yarn build

      - name: Add .nojekyll
        run: touch ./dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
